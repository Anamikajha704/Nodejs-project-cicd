apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  labels:
    app: nodejs-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
      - name: nodejs-container
        image: nodejs-app:latest # GitHub Actions will replace this exact string
        ports:
        - containerPort: 3000
        
       
        resources:
          requests:
            cpu: "100m"      
            memory: "128Mi" 
          limits:
            cpu: "200m"      
            memory: "256Mi"  
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10 # Gives Node extra time to boot safely before testing crashes  
          periodSeconds: 10        
          
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 3  # fast check so new containers route traffic quickly
          periodSeconds: 5        

---

apiVersion: v1
kind: Service
metadata:
  name: nodejs-app-service
  annotations:
  
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer 
  selector:
    app: nodejs-app
  ports:
    - protocol: TCP
      port: 80         
      targetPort: 3000
