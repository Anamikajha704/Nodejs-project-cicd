apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  labels:
    app: nodejs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
      - name: nodejs-container
        # 🚀 GENERIC PLACEHOLDER: The GitHub Actions script will dynamically overwrite this line!
        image: nodejs-app:latest 
        ports:
        - containerPort: 3000
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5   
          periodSeconds: 10        
          
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5   
          periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: nodejs-app-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
spec:
  type: LoadBalancer 
  selector:
    app: nodejs-app
  ports:
    - protocol: TCP
      port: 80         
      targetPort: 3000 
