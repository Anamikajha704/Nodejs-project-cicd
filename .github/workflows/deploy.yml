name: CI/CD Pipeline to AWS EKS

on:
  push:
    branches:
      - main # Triggers the pipeline when you push to the main branch

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nodejs-image          # Generic name for the public repo
  EKS_CLUSTER_NAME: nodejs-eks-cluster  # Generic name for the public repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    
    # 1. Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 3. Log in to Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Build, Tag, and Push Docker Image to ECR
    - name: Build and Push Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }} # Uses the unique git commit hash as the tag
      run: |
        # Builds the image using the files inside the app folder
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        # Saves the full image URL into the pipeline memory environment
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    # 5. Connect to AWS EKS
    - name: Update Kubeconfig for EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

    # 6. Deploy to Kubernetes
    - name: Deploy to EKS
      run: |
        # Dynamically updates the placeholder text inside your manifest file
        sed -i "s|[\t ]*image:.*|        image: ${{ env.image }}|g" k8s/k8s.yaml
        
        # Applies the updated manifest to your EKS cluster
        kubectl apply -f k8s/k8s.yaml
