name: CI/CD Pipeline to AWS EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nodejs-image          
  EKS_CLUSTER_NAME: nodejs-eks-cluster  
  # paste arn string of the role created in AWS IAM for GitHub Actions to assume
  AWS_ROLE_ARN: arn:aws:iam::123456789012:role/nodejs-eks-cluster-github-actions-role

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    #Gives the runner permission to securely request an AWS OIDC identity token
    permissions:
      id-token: write
      contents: read

    steps:
    
    # Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

   #AWS Credentials Configuration OIDC
    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    # Log in to Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Build, Tag, and Push Docker Image to ECR
    - name: Build and Push Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }} 
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "IMAGE_URL=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    # Connect to AWS EKS
    - name: Update Kubeconfig for EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

    # Deploy to Kubernetes
    - name: Deploy to EKS
      run: |
        sed -i "s|image: nodejs-app:latest|image: ${{ env.IMAGE_URL }}|g" k8s/k8s.yaml
        kubectl apply -f k8s/k8s.yaml
